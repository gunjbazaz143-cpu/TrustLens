{% extends 'base.html' %}
{% block title %}Page not found · {{ site_name }}{% endblock %}

{% block content %}
<div class="text-center py-5">
  <div class="display-1 fw-bold brand-gradient">404</div>
  <h1 class="fw-semibold mt-2">This page is not on the map</h1>
  <p class="text-muted-2">The page you are looking for does not exist or was moved.</p>
  <a href="{{ url_for('index') }}" class="btn btn-brand px-4"><i class="bi bi-house me-1"></i>Back home</a>
</div>
{% endblock %}
