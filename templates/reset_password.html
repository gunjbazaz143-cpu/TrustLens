{% extends 'base.html' %}
{% block title %}Set new password · {{ site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="glass-card p-4">
      <div class="text-center mb-4">
        <div class="icon-circle mx-auto mb-3"><i class="bi bi-shield-lock"></i></div>
        <h2 class="fw-bold">Set a new password</h2>
        <p class="text-muted-2 small">Choose a strong password to continue.</p>
      </div>
      <form method="post" action="{{ url_for('reset_password', token=token) }}">
        <div class="mb-3">
          <label class="form-label small-label">New password</label>
          <div class="input-group">
            <input type="password" class="form-control" name="password" id="pw" required minlength="8" placeholder="At least 8 characters">
            <button type="button" class="btn btn-outline-secondary" data-toggle-password="pw"><i class="bi bi-eye"></i></button>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label small-label">Confirm new password</label>
          <input type="password" class="form-control" name="confirm" required placeholder="Repeat the new password">
        </div>
        <button type="submit" class="btn btn-brand w-100"><i class="bi bi-check2-circle me-1"></i>Update password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
