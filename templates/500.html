{% extends 'base.html' %}
{% block title %}Server error · {{ site_name }}{% endblock %}

{% block content %}
<div class="text-center py-5">
  <div class="display-1 fw-bold brand-gradient">500</div>
  <h1 class="fw-semibold mt-2">Something went wrong</h1>
  <p class="text-muted-2">An unexpected error occurred while processing your request. Please try again.</p>
  <a href="{{ url_for('index') }}" class="btn btn-brand px-4"><i class="bi bi-house me-1"></i>Back home</a>
</div>
{% endblock %}
