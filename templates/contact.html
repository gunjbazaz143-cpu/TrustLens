{% extends 'base.html' %}
{% block title %}Contact · {{ site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h1 class="fw-bold mb-1">Contact us</h1>
    <p class="text-muted-2 mb-4">Questions, feedback or a false positive? Send us a message.</p>
    <form method="post" action="{{ url_for('contact') }}" class="glass-card p-4">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label small-label">Your name</label>
          <input type="text" class="form-control" name="name" placeholder="Jane Doe">
        </div>
        <div class="col-md-6">
          <label class="form-label small-label">Email address</label>
          <input type="email" class="form-control" name="email" required placeholder="you@example.com">
        </div>
        <div class="col-12">
          <label class="form-label small-label">Subject</label>
          <input type="text" class="form-control" name="subject" required placeholder="What is this about?">
        </div>
        <div class="col-12">
          <label class="form-label small-label">Message</label>
          <textarea class="form-control" name="message" rows="5" required placeholder="Describe your question or report..."></textarea>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-brand px-4"><i class="bi bi-send me-1"></i>Send message</button>
        </div>
      </div>
    </form>
    <div class="glass-card p-3 mt-3 d-flex flex-wrap gap-3">
      <div><i class="bi bi-envelope text-brand me-2"></i>support@trustlens.app</div>
      <div><i class="bi bi-clock text-brand me-2"></i>Replies within 2 working days</div>
    </div>
  </div>
</div>
{% endblock %}
