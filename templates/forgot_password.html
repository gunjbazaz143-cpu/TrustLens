{% extends 'base.html' %}
{% block title %}Forgot password · {{ site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="glass-card p-4">
      <div class="text-center mb-4">
        <div class="icon-circle mx-auto mb-3"><i class="bi bi-key"></i></div>
        <h2 class="fw-bold">Reset your password</h2>
        <p class="text-muted-2 small">Enter your account email and we will send you a reset link.</p>
      </div>
      <form method="post" action="{{ url_for('forgot_password') }}">
        <div class="mb-3">
          <label class="form-label small-label">Email address</label>
          <input type="email" class="form-control" name="email" required autofocus placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn-brand w-100"><i class="bi bi-envelope me-1"></i>Send reset link</button>
      </form>
      <div class="text-center mt-3 small">
        <a href="{{ url_for('login') }}" class="link-secondary"><i class="bi bi-arrow-left me-1"></i>Back to sign in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
