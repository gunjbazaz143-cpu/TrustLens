{% extends 'base.html' %}
{% block title %}Admin sign in · {{ site_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="glass-card p-4">
      <div class="text-center mb-4">
        <div class="icon-circle mx-auto mb-3"><i class="bi bi-shield-lock"></i></div>
        <h2 class="fw-bold">Administrator sign in</h2>
        <p class="text-muted-2 small">Restricted area - authorised personnel only.</p>
      </div>
      <form method="post" action="{{ url_for('admin_login') }}">
        <div class="mb-3">
          <label class="form-label small-label">Admin email</label>
          <input type="email" class="form-control" name="email" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label small-label">Password</label>
          <input type="password" class="form-control" name="password" required>
        </div>
        <button type="submit" class="btn btn-outline-warning w-100"><i class="bi bi-shield-lock me-1"></i>Sign in as admin</button>
      </form>
      <div class="text-center mt-3">
        <a href="{{ url_for('index') }}" class="link-secondary small"><i class="bi bi-arrow-left me-1"></i>Back to site</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
