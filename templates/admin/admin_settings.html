{% extends 'base.html' %}
{% block title %}Settings · {{ site_name }}{% endblock %}

{% block content %}
<h1 class="fw-bold mb-4"><i class="bi bi-gear me-2 text-warning"></i>System settings</h1>
{% include 'admin/_admin_nav.html' %}

<div class="row justify-content-center">
  <div class="col-lg-7">
    <form method="post" action="{{ url_for('admin_settings') }}" class="glass-card p-4">
      <div class="mb-3">
        <label class="form-label small-label">Site name</label>
        <input type="text" class="form-control" name="site_name" value="{{ settings.get('site_name', 'TrustLens') }}">
        <div class="form-text">Shown in the navbar and footer.</div>
      </div>
      <div class="mb-3">
        <label class="form-label small-label">Maintenance mode</label>
        <select class="form-select" name="maintenance_mode">
          <option value="off" {% if settings.get('maintenance_mode') == 'off' %}selected{% endif %}>Off</option>
          <option value="on" {% if settings.get('maintenance_mode') == 'on' %}selected{% endif %}>On</option>
        </select>
        <div class="form-text">Reserved flag for future maintenance pages.</div>
      </div>
      <div class="mb-4">
        <label class="form-label small-label">Max upload size (MB)</label>
        <input type="number" class="form-control" name="max_upload_mb" value="{{ settings.get('max_upload_mb', '16') }}" min="1" max="64">
      </div>
      <button type="submit" class="btn btn-brand px-4"><i class="bi bi-check2-circle me-1"></i>Save settings</button>
    </form>
  </div>
</div>
{% endblock %}
